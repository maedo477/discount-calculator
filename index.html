<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 할인율 계산기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white/80 backdrop-blur-md shadow-2xl rounded-3xl w-full max-w-md p-6 sm:p-8 border border-white/40">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 tracking-tight">🏷️ 스마트 할인 계산기</h1>
            <p class="text-sm text-gray-500 mt-1">금액과 할인율을 입력하여 최종 가격을 확인하세요</p>
        </div>

        <!-- Input Section -->
        <div class="space-y-4">
            <!-- Original Price Input -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">원래 금액 (원)</label>
                <div class="relative">
                    <input type="text" id="originalPrice" placeholder="예: 50,000" 
                        class="w-full pl-4 pr-10 py-3 bg-gray-50 border border-gray-200 rounded-2xl text-lg font-medium text-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                    <span class="absolute right-4 top-3.5 text-gray-400 font-medium">원</span>
                </div>
            </div>

            <!-- Discount Percentage Input -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">할인율 (%)</label>
                <div class="relative">
                    <input type="number" id="discountRate" placeholder="예: 20" min="0" max="100"
                        class="w-full pl-4 pr-10 py-3 bg-gray-50 border border-gray-200 rounded-2xl text-lg font-medium text-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                    <span class="absolute right-4 top-3.5 text-gray-400 font-medium">%</span>
                </div>
            </div>

            <!-- Quick Preset Buttons -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">빠른 할인율 선택</label>
                <div class="grid grid-cols-5 gap-2">
                    <button onclick="setDiscount(5)" class="py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold rounded-xl text-sm transition-colors">5%</button>
                    <button onclick="setDiscount(10)" class="py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold rounded-xl text-sm transition-colors">10%</button>
                    <button onclick="setDiscount(20)" class="py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold rounded-xl text-sm transition-colors">20%</button>
                    <button onclick="setDiscount(30)" class="py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold rounded-xl text-sm transition-colors">30%</button>
                    <button onclick="setDiscount(50)" class="py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold rounded-xl text-sm transition-colors">50%</button>
                </div>
            </div>
        </div>

        <div class="mt-8 pt-6 border-t border-gray-100 space-y-4">
            <!-- Saved Amount -->
            <div class="flex justify-between items-center bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                <span class="text-sm font-medium text-emerald-800">절약된 금액</span>
                <span id="savedAmount" class="text-lg font-bold text-emerald-600">0 원</span>
            </div>

            <!-- Final Price -->
            <div class="flex justify-between items-center bg-indigo-600 p-4 rounded-2xl shadow-lg shadow-indigo-100">
                <span class="text-sm font-medium text-indigo-100">최종 결제 금액</span>
                <div class="flex items-center space-x-2">
                    <span id="finalPrice" class="text-2xl font-bold text-white">0 원</span>
                    <button onclick="copyResult()" title="결과 복사하기" class="p-2 bg-indigo-500 hover:bg-indigo-400 text-white rounded-xl transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="mt-6">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-semibold text-gray-600 uppercase tracking-wider">최근 계산 기록</span>
                <button onclick="clearHistory()" class="text-xs text-red-500 hover:text-red-700 font-medium">기록 삭제</button>
            </div>
            <div id="historyList" class="space-y-2 max-h-36 overflow-y-auto pr-1">
                <p class="text-xs text-gray-400 text-center py-4">아직 계산 기록이 없습니다.</p>
            </div>
        </div>

        <!-- Custom Notification Modal / Toast -->
        <div id="toast" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-4 py-2 rounded-xl text-sm font-medium opacity-0 transition-opacity pointer-events-none z-50">
            클립보드에 복사되었습니다!
        </div>

    </div>

    <script>
        const originalPriceInput = document.getElementById('originalPrice');
        const discountRateInput = document.getElementById('discountRate');
        const savedAmountEl = document.getElementById('savedAmount');
        const finalPriceEl = document.getElementById('finalPrice');
        const historyListEl = document.getElementById('historyList');
        const toastEl = document.getElementById('toast');

        let history = [];

        // Format number with commas
        function formatNumber(num) {
            return num.toLocaleString('ko-KR');
        }

        // Clean input string to numeric value
        function parsePrice(str) {
            return parseFloat(str.replace(/,/g, '')) || 0;
        }

        // Handle live formatting for original price input
        originalPriceInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/[^0-9]/g, '');
            if (value) {
                e.target.value = formatNumber(parseInt(value, 10));
            } else {
                e.target.value = '';
            }
            calculate();
        });

        discountRateInput.addEventListener('input', () => {
            calculate();
        });

        // Set quick discount rate
        function setDiscount(rate) {
            discountRateInput.value = rate;
            calculate();
        }

        // Core calculation function
        function calculate() {
            const price = parsePrice(originalPriceInput.value);
            const rate = parseFloat(discountRateInput.value) || 0;

            if (price <= 0 || rate < 0) {
                savedAmountEl.textContent = '0 원';
                finalPriceEl.textContent = '0 원';
                return;
            }

            const saved = Math.round(price * (rate / 100));
            const final = price - saved;

            savedAmountEl.textContent = formatNumber(saved) + ' 원';
            finalPriceEl.textContent = formatNumber(final) + ' 원';

            if (price > 0 && rate > 0) {
                addHistory(price, rate, final);
            }
        }

        // Add to history list (debounced or on change)
        let lastLogged = '';
        function addHistory(price, rate, final) {
            const recordText = `${formatNumber(price)}원 (${rate}%) → ${formatNumber(final)}원`;
            if (lastLogged === recordText) return;
            lastLogged = recordText;

            // Avoid duplicate continuous entries
            if (history.length > 0 && history[0] === recordText) return;

            history.unshift(recordText);
            if (history.length > 5) history.pop();

            renderHistory();
        }

        function renderHistory() {
            if (history.length === 0) {
                historyListEl.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">아직 계산 기록이 없습니다.</p>';
                return;
            }

            historyListEl.innerHTML = history.map(item => `
                <div class="bg-gray-50 p-2.5 rounded-xl text-xs text-gray-700 flex justify-between items-center border border-gray-100">
                    <span>${item}</span>
                </div>
            `).join('');
        }

        function clearHistory() {
            history = [];
            renderHistory();
        }

        // Copy final result
        function copyResult() {
            const textToCopy = `최종 결제 금액: ${finalPriceEl.textContent} (절약: ${savedAmountEl.textContent})`;
            
            const textarea = document.createElement('textarea');
            textarea.value = textToCopy;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                console.error('복사 실패', err);
            }
            document.body.removeChild(textarea);
        }

        function showToast() {
            toastEl.classList.remove('opacity-0');
            toastEl.classList.add('opacity-100');
            setTimeout(() => {
                toastEl.classList.remove('opacity-100');
                toastEl.classList.add('opacity-0');
            }, 2000);
        }
    </script>
</body>
</html>
